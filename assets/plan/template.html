<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title><!--TITLE--></title>
<!-- The weekly sprint plan. Static: build.py fills <!--BODY--> from one week's JSON. Change the JSON, not this file. -->
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--muted:#6b6a64;--line:#e6e3dc;--accent:#2f5bd3;--accent-soft:#e7edfb;
--good:#1f8a5b;--good-soft:#e3f3ea;--warn:#b26a00;--warn-soft:#fbefd9;--bad:#b4342d;--bad-soft:#f8e1df}
@media (prefers-color-scheme:dark){:root{--bg:#151513;--card:#1e1e1b;--ink:#ecebe6;--muted:#a3a29b;--line:#2f2e2a;--accent:#7d9cf0;--accent-soft:#1f2a45;
--good:#5cc497;--good-soft:#16302a;--warn:#e6a64a;--warn-soft:#3a2c14;--bad:#ec7b73;--bad-soft:#3d1d1b}}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
main{max-width:1080px;margin:0 auto;padding:40px 24px 80px}
nav{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:8px;z-index:2;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
nav a{color:var(--muted);text-decoration:none;font-weight:600} nav a:hover{color:var(--accent)}
.kicker{color:var(--accent);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:12px;margin-top:48px}
h1{font-size:34px;margin:6px 0 4px;letter-spacing:-.02em} h2{font-size:26px;margin:4px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;max-width:820px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:12px 0}
.goal h3{margin:0 0 2px;font-size:17px;display:flex;align-items:center;gap:10px}
.gn{background:var(--accent-soft);color:var(--accent);border-radius:8px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.dt{color:var(--muted);margin:0 0 8px;font-size:14px}
table{width:100%;border-collapse:collapse} td{padding:7px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
td:first-child{width:112px;white-space:nowrap} td:last-child{width:150px;text-align:right} td.own{width:140px;font-weight:600}
.key{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--accent);text-decoration:none} .key.new{color:var(--bad);font-weight:700}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-accent{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px} .stat b{font-size:30px;display:block;line-height:1.1}
.stat > span{color:var(--muted);font-size:13px;display:block;margin-top:4px} .stat .lbl{font-weight:600;font-size:14px;margin:4px 0}
.key-legend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--muted);margin:6px 0 4px}
.dl{font-size:12.5px;color:var(--muted);margin-top:3px} h3.sec{font-size:15px;margin:18px 0 0;color:var(--muted)}
.grid2,.grid3{display:grid;gap:12px;grid-template-columns:1fr 1fr} .grid3{grid-template-columns:repeat(3,1fr)} .grid2 .goal,.grid3 .goal{margin:0}
.goal.t-good{border-left:4px solid var(--good)} .goal.t-bad{border-left:4px solid var(--bad)} .goal.t-warn{border-left:4px solid var(--warn)} .goal.t-accent{border-left:4px solid var(--accent)}
.load{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--muted)} .load b{color:var(--ink)}
.note{color:var(--muted);font-size:13px;margin-top:10px} ol{padding-left:22px} li{margin:6px 0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0}
@media (max-width:720px){.stats,.grid2,.grid3{grid-template-columns:1fr 1fr} .grid2,.grid3{grid-template-columns:1fr} td:first-child,td.own,td:last-child{width:auto} table,tbody,tr,td{display:block} tr{padding:6px 0;border-top:1px solid var(--line)} td{border:0;padding:2px 0;text-align:left!important}}
a{color:var(--accent)}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em}
</style></head><body><main>
<!--BODY-->
</main></body></html>
