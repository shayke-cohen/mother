="137" width="9" height="8" rx="2" fill="#3a404d"/><rect x="160.28" y="137" width="9" height="8" rx="2" fill="#3a404d"/><rect x="171.28" y="137" width="9" height="8" rx="2" fill="#3a404d"/><rect x="190.28" y="133" width="65" height="18" rx="4" fill="#2bb673"/><text x="222.78" y="146" font-size="11" fill="#101216" font-weight="700" text-anchor="middle">led here</text><text x="261.28" y="146" font-size="12" fill="#9299a8">heartbeat 20s ago</text><rect x="15" y="163" width="97" height="24" rx="6" fill="#e8704f"/><text x="25" y="179" font-size="12" fill="#16181d" font-weight="700">Needs you 2</text><rect x="118" y="163" width="69" height="24" rx="6" fill="none" stroke="#525968"/><text x="128" y="179" font-size="12" fill="#e7e9ee" font-weight="600">Inbox 3</text><rect x="193" y="163" width="90" height="24" rx="6" fill="none" stroke="#525968"/><text x="203" y="179" font-size="12" fill="#e7e9ee" font-weight="600">Sessions 2</text><rect x="289" y="163" width="69" height="24" rx="6" fill="none" stroke="#525968"/><text x="299" y="179" font-size="12" fill="#e7e9ee" font-weight="600">Today 5</text><rect x="364" y="163" width="62" height="24" rx="6" fill="none" stroke="#525968"/><text x="374" y="179" font-size="12" fill="#e7e9ee" font-weight="600">Team 4</text><rect x="432" y="163" width="62" height="24" rx="6" fill="none" stroke="#525968"/><text x="442" y="179" font-size="12" fill="#e7e9ee" font-weight="600">Health</text><rect x="500" y="163" width="41" height="24" rx="6" fill="none" stroke="#525968"/><text x="510" y="179" font-size="12" fill="#9299a8" font-weight="600">All</text><rect x="15" y="199" width="610" height="196" rx="8" fill="#1d2028" stroke="#e0a019" stroke-width="2"/><text x="27" y="222" font-size="13" fill="#e7e9ee" font-weight="700">▾ Vendor contract renewal: reply by Friday</text><rect x="27" y="233" width="40" height="18" rx="4" fill="#e0a019"/><text x="47.0" y="246" font-size="11" fill="#101216" font-weight="700" text-anchor="middle">asks</text><rect x="73" y="233" width="40" height="18" rx="4" fill="#4f9bd9"/><text x="93.0" y="246" font-size="11" fill="#101216" font-weight="700" text-anchor="middle">case</text><text x="119" y="246" font-size="12" fill="#9299a8">waiting on the manager · asked 6m ago</text><text x="27" y="273" font-size="12.5" fill="#e7e9ee">The reply to Lee is drafted: it accepts the 12-month term and asks for the</text><text x="27" y="290" font-size="12.5" fill="#e7e9ee">March price to hold. Send it?</text><text x="27" y="312" font-size="11.5" fill="#9299a8">Send it: "Send the reply as drafted."</text><text x="27" y="328" font-size="11.5" fill="#9299a8">Add the date: "Send it, and add that we need an answer by Thursday."</text><text x="27" y="344" font-size="11.5" fill="#9299a8">Don't reply: "Don't send anything; close the case."</text><rect x="27" y="356" width="71" height="24" rx="6" fill="#e8704f"/><text x="62.5" y="372" font-size="12" fill="#16181d" font-weight="700" text-anchor="middle">Send it</text><rect x="104" y="356" width="106" height="24" rx="6" fill="none" stroke="#525968"/><text x="157.0" y="372" font-size="12" fill="#e7e9ee" font-weight="600" text-anchor="middle">Add the date</text><rect x="216" y="356" width="99" height="24" rx="6" fill="none" stroke="#525968"/><text x="265.5" y="372" font-size="12" fill="#e7e9ee" font-weight="600" text-anchor="middle">Don't reply</text><rect x="321" y="356" width="50" height="24" rx="6" fill="none" stroke="#525968"/><text x="346.0" y="372" font-size="12" fill="#e7e9ee" font-weight="600" text-anchor="middle">Open</text><rect x="15" y="405" width="610" height="62" rx="8" fill="#1d2028" stroke="#e0a019" stroke-width="1" stroke-opacity="0.55"/><text x="27" y="428" font-size="13" fill="#e7e9ee" font-weight="700">▸ Sprint plan for the Platform team</text><rect x="410" y="412" width="85" height="24" rx="6" fill="#e8704f"/><text x="452.5" y="428" font-size="12" fill="#16181d" font-weight="700" text-anchor="middle">Keep both</text><rect x="501" y="412" width="112" height="24" rx="6" fill="none" stroke="#525968"/><text x="557.0" y="428" font-size="12" fill="#e7e9ee" font-weight="600" text-anchor="middle">Drop PLAT-140</text><rect x="27" y="440" width="40" height="18" rx="4" fill="#e0a019"/><text x="47.0" y="453" font-size="11" fill="#101216" font-weight="700" text-anchor="middle">asks</text><text x="73" y="453" font-size="12" fill="#e7e9ee">Two goals overlap. Keep both, or drop PLAT-140 from the sprint?</text><text x="15" y="491" font-size="11.5" fill="#9299a8">A button sends its answer into that session. The guard asks you to confirm the send.</text><text x="320.0" y="513" font-size="11" fill="#69707f" text-anchor="middle">Mock of the Chief pane (/chief). Every item here is invented.</text></svg>
