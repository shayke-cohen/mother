text x="966.5" y="240" font-size="12" fill="#16181d" font-weight="700" text-anchor="middle">Review PR</text><rect x="912" y="260" width="238" height="78" rx="8" fill="#1d2028" stroke="#b07cf0" stroke-width="1" stroke-opacity="0.55"/><text x="924" y="282" font-size="12.5" fill="#e7e9ee" font-weight="700">Contract renewal</text><rect x="924" y="290" width="40" height="18" rx="4" fill="#b07cf0"/><text x="944.0" y="303" font-size="11" fill="#101216" font-weight="700" text-anchor="middle">mail</text><rect x="970" y="290" width="46" height="18" rx="4" fill="#5b8def"/><text x="993.0" y="303" font-size="11" fill="#101216" font-weight="700" text-anchor="middle">reply</text><rect x="924" y="310" width="99" height="24" rx="6" fill="#e8704f"/><text x="973.5" y="326" font-size="12" fill="#16181d" font-weight="700" text-anchor="middle">Draft reply</text><rect x="0.5" y="0.5" width="1199" height="399" rx="14" fill="none" stroke="#343946"/></svg>
